name: release-tags

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Auto-tag each crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify changelog entries before tagging
        run: |
          set -euo pipefail
          for crate in br-llm-clients-contract br-llm-clients; do
            bash .github/scripts/check-changelog.sh "$crate"
          done

      - name: Tag and release each crate version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for crate in br-llm-clients-contract br-llm-clients; do
            bash .github/scripts/release-crate.sh "$crate"
          done
