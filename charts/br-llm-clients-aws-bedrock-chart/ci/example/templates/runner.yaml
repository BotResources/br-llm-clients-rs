apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-runner
spec:
  selector:
    matchLabels:
      app: example-runner
  template:
    metadata:
      labels:
        app: example-runner
    spec:
      containers:
        - name: runner
          image: ghcr.io/example/runner:1.0.0
          env:
            - name: RUNNER_NAME
              value: example
            {{- include "br-llm-clients-aws-bedrock-chart.env" .Values.bedrock | nindent 12 }}
