[package]
name = "br-llm-clients-common-call"
version = "0.2.0"
description = "Runs one call of an LLM client: encodes the request, sends it, applies the shared rules of the family and gives back the outcome, for any provider and any wire dialect"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-common-http = { path = "../br-llm-clients-common-http", version = "0.2.0" }
br-llm-clients-common-sse = { path = "../br-llm-clients-common-sse", version = "0.1.0" }
br-llm-clients-core = { path = "../br-llm-clients-core", version = "0.4.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
