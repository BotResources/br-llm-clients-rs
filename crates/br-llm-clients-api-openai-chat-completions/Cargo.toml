[package]
name = "br-llm-clients-api-openai-chat-completions"
version = "0.1.0"
description = "the OpenAI Chat Completions wire dialect: encodes a request and decodes the streamed reply and the errors of the Chat Completions API, for the shared call of the family"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-common-call = { path = "../br-llm-clients-common-call", version = "0.1.0" }
br-llm-clients-core = { path = "../br-llm-clients-core", version = "0.4.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
