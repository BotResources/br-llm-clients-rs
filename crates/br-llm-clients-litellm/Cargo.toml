[package]
name = "br-llm-clients-litellm"
version = "0.1.0"
description = "the Client for a LiteLLM proxy: sends a call to the proxy in the chat completions, responses or messages dialect, with a virtual key and the capabilities the operator declares for a name"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-api-anthropic-messages = { path = "../br-llm-clients-api-anthropic-messages", version = "0.1.0" }
br-llm-clients-api-openai-chat-completions = { path = "../br-llm-clients-api-openai-chat-completions", version = "0.1.0" }
br-llm-clients-api-openai-responses = { path = "../br-llm-clients-api-openai-responses", version = "0.1.0" }
br-llm-clients-common-call = { path = "../br-llm-clients-common-call", version = "0.1.0" }
br-llm-clients-common-http = { path = "../br-llm-clients-common-http", version = "0.1.0" }
br-llm-clients-core = { path = "../br-llm-clients-core", version = "0.4.1" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
tokio = { version = "1", features = ["full", "test-util"] }
