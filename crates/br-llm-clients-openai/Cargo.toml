[package]
name = "br-llm-clients-openai"
version = "0.1.0"
description = "Client for the first-party OpenAI API: sends every call to the Responses API with an API key, and knows what each model preset accepts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-api-openai-responses = { path = "../br-llm-clients-api-openai-responses", version = "0.1.0" }
br-llm-clients-common-call = { path = "../br-llm-clients-common-call", version = "0.1.0" }
br-llm-clients-common-http = { path = "../br-llm-clients-common-http", version = "0.1.0" }
br-llm-clients-core = { path = "../br-llm-clients-core", version = "0.4.1" }
thiserror = "2"

[dev-dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
tokio = { version = "1", features = ["macros", "rt"] }
