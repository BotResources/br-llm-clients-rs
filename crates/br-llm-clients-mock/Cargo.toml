[package]
name = "br-llm-clients-mock"
version = "0.1.0"
description = "Scripted mock Client for tests: answers from a script the test writes, behaves like a real client library of the family, no network, no runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-core = { path = "../br-llm-clients-core", version = "0.1.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "v0.2.0", version = "0.2.0" }
serde_json = "1"
thiserror = "2"
