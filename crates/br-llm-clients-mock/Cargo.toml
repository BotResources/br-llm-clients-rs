[package]
name = "br-llm-clients-mock"
version = "0.6.0"
description = "Scripted mock Client for tests: answers from a script the test writes, behaves like a real client library of the family, no network, no runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-core = { git = "https://github.com/BotResources/br-llm-clients-rs", tag = "br-llm-clients-core/v0.5.0", version = "0.5.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v2.1.0", version = "2.1.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
