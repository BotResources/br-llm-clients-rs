[package]
name = "br-llm-clients-core"
version = "0.5.0"
description = "Contract shared by all LLM client libraries: call settings, request over a projected thread, tool and output vocabulary, errors, the rendering of a history, the capabilities declaration with its ordered check, the Client, StreamSink and IdSource traits"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v2.1.0", version = "2.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
serde_json = "1"
