[package]
name = "br-llm-clients-core"
version = "0.4.1"
description = "Contract shared by all LLM client libraries: call settings, request, tool and output vocabulary, errors, the capabilities declaration with its ordered check, the Client and StreamSink traits"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
