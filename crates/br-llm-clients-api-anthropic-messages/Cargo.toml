[package]
name = "br-llm-clients-api-anthropic-messages"
version = "0.1.0"
description = "the Anthropic Messages wire dialect: encodes a request and decodes the streamed reply and the errors of the Anthropic Messages API, for the shared call of the family"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-clients-common-call = { path = "../br-llm-clients-common-call", version = "0.1.0" }
br-llm-clients-core = { git = "https://github.com/BotResources/br-llm-clients-rs", tag = "br-llm-clients-core/v0.4.1", version = "0.4.1" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.5.0", version = "0.5.0" }
serde_json = "1"

[dev-dependencies]
br-llm-clients-common-http = { git = "https://github.com/BotResources/br-llm-clients-rs", tag = "br-llm-clients-common-http/v0.1.0", version = "0.1.0" }
tokio = { version = "1", features = ["full", "test-util"] }
